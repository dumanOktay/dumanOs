name: Build dumanOS Multi-Arch ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build dumanOS ARM64 (Native Runner)
    # Use GitHub's native ARM64 runner or fallback to fast Ubuntu runner
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 120

    steps:
      - name: Checkout dumanOS Repository
        uses: actions/checkout@v4

      - name: Install ISO Building Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-efi \
            mtools \
            squashfs-tools \
            dosfstools \
            libarchive-tools \
            curl \
            git

      - name: Build dumanOS ARM64 ISO
        run: |
          sudo ARCH=arm64 bash builder/build.sh

      - name: Calculate Checksums
        run: |
          cd output
          sha256sum dumanOS-*.iso > dumanOS-arm64-checksums.txt
          ls -lh

      - name: Upload ARM64 ISO to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dumanOS-arm64-Live-ISO
          path: output/dumanOS-arm64.iso
          retention-days: 14

  build-x86_64:
    name: Build dumanOS x86_64 (Intel/AMD)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout dumanOS Repository
        uses: actions/checkout@v4

      - name: Install ISO Building Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            squashfs-tools \
            dosfstools \
            libarchive-tools \
            curl \
            git

      - name: Build dumanOS x86_64 ISO
        run: |
          sudo ARCH=amd64 bash builder/build.sh

      - name: Calculate Checksums
        run: |
          cd output
          sha256sum dumanOS-*.iso > dumanOS-x86_64-checksums.txt
          ls -lh

      - name: Upload x86_64 ISO to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dumanOS-x86_64-Live-ISO
          path: output/dumanOS-amd64.iso
          retention-days: 14
