name: Build dumanOS ARM64 ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build dumanOS ARM64 (Apple Silicon / UTM)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout dumanOS Repository
        uses: actions/checkout@v4

      - name: Install ISO Building & Emulation Tools
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap \
            debian-archive-keyring \
            eatmydata \
            qemu-user-static \
            binfmt-support \
            xorriso \
            isolinux \
            syslinux-efi \
            mtools \
            squashfs-tools \
            dosfstools \
            libarchive-tools \
            curl \
            git

      - name: Build dumanOS ARM64 ISO Image
        run: |
          sudo bash builder/build.sh

      - name: Calculate Checksums
        run: |
          cd output
          sha256sum dumanOS-*.iso > dumanOS-arm64-checksums.txt
          ls -lh

      - name: Upload ARM64 ISO to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dumanOS-arm64-Live-ISO
          path: output/dumanOS-*.iso
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: |
            output/dumanOS-arm64.iso
            output/dumanOS-arm64-checksums.txt
          tag_name: v1.0.0-arm64
          name: "dumanOS Release ARM64 (Apple Silicon / UTM)"
          body: |
            ## 🚀 dumanOS ARM64 Live & Installable ISO
            
            - **Target:** Apple Silicon (UTM / Mac M1/M2/M3/M4), Raspberry Pi 4/5
            - **Base:** Debian 12 Minimal + KDE Plasma Minimal (Wayland)
            - **Android Engine:** Waydroid Container (%100 Native ARM Performance)
            - **Google Play:** MindTheGapps + GSF Auto-Registration
            - **RAM Footprint:** ~380-450 MB at idle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
