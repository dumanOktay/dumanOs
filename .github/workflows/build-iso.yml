name: Build dumanOS Multi-Arch ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Mimari Seçin (Architecture)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - amd64

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [arm64]

    steps:
      - name: Checkout dumanOS Repository
        uses: actions/checkout@v4

      - name: Install Multi-Arch & ISO Building Tools
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            xorriso \
            isolinux \
            syslinux-efi \
            mtools \
            squashfs-tools \
            dosfstools \
            libarchive-tools \
            curl \
            git

      - name: Build dumanOS ARM64 ISO Image
        run: |
          sudo ARCH=${{ matrix.arch }} bash builder/build.sh

      - name: Calculate Checksums
        run: |
          cd output
          sha256sum dumanOS-*.iso > dumanOS-checksums.txt
          ls -lh

      - name: Upload ARM64 ISO to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dumanOS-${{ matrix.arch }}-Live-ISO
          path: output/dumanOS-*.iso
          retention-days: 14

      - name: Create GitHub Release (On tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/dumanOS-*.iso
            output/dumanOS-checksums.txt
          tag_name: v1.0.0-arm64-${{ github.run_number }}
          name: "dumanOS Release ARM64 (Build ${{ github.run_number }})"
          body: |
            ## 🚀 dumanOS ARM64 Live & Installable ISO
            
            - **Target:** Apple Silicon (UTM/VM), Raspberry Pi 4/5, ARM64 Devices
            - **Base:** Debian 12 Minimal + KDE Plasma Minimal (Wayland)
            - **Android Engine:** Waydroid Container (%100 Native ARM Performance)
            - **Google Play:** MindTheGapps + GSF Auto-Registration
            - **RAM Footprint:** ~380-450 MB at idle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
